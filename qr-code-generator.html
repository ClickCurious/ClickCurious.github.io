
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Free QR Code Generator - Create & Download QR Codes | ClickCurious</title>

    <meta name="description" content="Create QR codes for text and website URLs instantly with ClickCurious. Generate and download QR codes easily using our free online QR code generator.">

    <meta name="robots" content="index, follow">

    <meta name="author" content="ClickCurious">

    <link rel="canonical" href="https://clickcurious.github.io/qr-code-generator.html">

    <link rel="stylesheet" href="style.css">

    <style>
        .qr-container {
            max-width: 850px;
            margin: 55px auto;
            padding: 25px;
        }

        .qr-card {
            background: white;
            border: 1px solid #e5eaf2;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 30px rgba(20, 40, 80, 0.06);
        }

        .qr-card h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .qr-description {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .qr-form label {
            display: block;
            font-weight: 600;
            margin: 18px 0 8px;
        }

        .qr-form input,
        .qr-form select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d8e0ec;
            border-radius: 9px;
            font-size: 15px;
            background: white;
        }

        .qr-button {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .qr-button:hover {
            background: #1d4ed8;
        }

        .qr-result {
            display: none;
            margin-top: 28px;
            padding: 24px;
            background: #f8fafc;
            border: 1px solid #e5eaf2;
            border-radius: 12px;
            text-align: center;
        }

        .qr-result img {
            display: block;
            width: 230px;
            max-width: 100%;
            height: auto;
            margin: 20px auto;
            background: white;
        }

        .download-button {
            display: inline-block;
            padding: 12px 22px;
            background: #16a34a;
            color: white;
            border-radius: 9px;
            text-decoration: none;
            font-weight: 600;
        }

        .download-button:hover {
            background: #15803d;
        }

        .qr-error {
            color: #dc2626;
            font-size: 14px;
            margin-top: 12px;
        }

        @media (max-width: 600px) {
            .qr-container {
                margin: 25px auto;
                padding: 15px;
            }

            .qr-card {
                padding: 20px;
            }

            .qr-card h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<!-- NAVIGATION -->
<header class="navbar">
    <a href="index.html" class="logo">
        Click<span>Curious</span><span class="logo-dot">.</span>
    </a>

    <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="index.html#categories">Categories</a>
        <a href="index.html#popular">All Tools</a>
        <a href="index.html#about">About</a>
    </nav>

    <a href="index.html#popular" class="nav-button">Explore Tools ↗</a>
</header>

<body>

    <div class="qr-container">
        <div class="qr-card">

            <h1>QR Code Generator</h1>

            <p class="qr-description">
                Create a QR code for your website, text or other information.
                Download your QR code and share it anywhere.
            </p>

            <div class="qr-form">

                <label for="qrText">Enter text or website URL</label>
                <input
                    type="text"
                    id="qrText"
                    placeholder="https://example.com"
                >

                <label for="qrSize">QR Code Size</label>
                <select id="qrSize">
                    <option value="200">Small (200 × 200)</option>
                    <option value="300" selected>Medium (300 × 300)</option>
                    <option value="400">Large (400 × 400)</option>
                    <option value="500">Extra Large (500 × 500)</option>
                </select>

                <button class="qr-button" id="generateQR">
                    Generate QR Code
                </button>

                <p class="qr-error" id="qrError"></p>

            </div>

            <div class="qr-result" id="qrResult">

                <h2>Your QR Code</h2>

                <img id="qrImage" alt="Generated QR Code">

                <a
                    id="downloadQR"
                    class="download-button"
                    href="#"
                    download="clickcurious-qr-code.png"
                >
                    Download QR Code
                </a>

            </div>

        </div>
    </div>

    <script src="qr-code-generator.js"></script>

</body>
</html>
